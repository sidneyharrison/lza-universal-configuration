            type: natGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-nat-a"
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-rt-private-b"
        routes:
          - name: Internal
            destination: "{{ GlobalCidr }}"
            type: transitGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          - name: Internet
            destination: 0.0.0.0/0
            type: natGateway
            target: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-nat-a"
    subnets:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-public-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-rt-public-a"
        mapPublicIpOnLaunch: true
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-pool"
          netmaskLength: 24
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-public-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-rt-public-b"
        mapPublicIpOnLaunch: true
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-pool"
          netmaskLength: 24
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-private-a"
        availabilityZone: a
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-rt-private-a"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-pool"
          netmaskLength: 24
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-private-b"
        availabilityZone: b
        routeTable: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-rt-private-b"
        ipamAllocation:
          ipamPoolName: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-pool"
          netmaskLength: 24
    natGateways:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-nat-a"
        subnet: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-public-a"
    transitGatewayAttachments:
      - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices"
        transitGateway:
          name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw"
          account: Network
        routeTableAssociations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt"
        routeTablePropagations:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-tgw-rt"
        subnets:
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-private-a"
          - "{{ AcceleratorPrefix }}-{{ HomeRegion }}-sharedservices-private-b"

  - name: "{{ AcceleratorPrefix }}-{{ HomeRegion }}-perimeter"
    account: Perimeter
